<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🔤 英语启蒙 · 迪士尼世界</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="disney.css" />
</head>
<body class="lang-both">
  <header class="topbar">
    <div class="brand">🔤 英语启蒙<span class="brand-sub">· 迪士尼世界</span></div>
    <div class="lang-toggle" id="langToggle" role="tablist" aria-label="语言切换">
      <button class="lang-btn" data-lang="zh" type="button">中文</button>
      <button class="lang-btn" data-lang="en" type="button">English</button>
      <button class="lang-btn active" data-lang="both" type="button">双语</button>
    </div>
  </header>

  <section class="hero">
    <h1 class="hero-title">
      <span class="t-zh">迪士尼动画大全</span><span class="t-en">Disney Movies</span>
    </h1>
    <p class="hero-sub">
      <span class="t-zh">按年代看经典，点开认识每个动画的关键角色，学一句英语！</span>
      <span class="t-en">Browse by era, meet key characters, and learn a phrase!</span>
    </p>
  </section>

  <div class="controls">
    <div class="search-wrap">
      <span class="search-ico">🔍</span>
      <input id="search" class="search-input" type="search"
             placeholder="搜索动画或角色 / Search movie or character…"
             aria-label="搜索" />
    </div>
    <div class="era-chips" id="eraChips" role="tablist" aria-label="年代筛选"><!-- JS --></div>
    <button class="oscar-toggle" id="oscarToggle" type="button" aria-pressed="false">
      🏆 <span class="t-zh">只看奥斯卡最佳</span><span class="t-en">Oscar winners only</span>
    </button>
  </div>

  <main class="list" id="list"><!-- JS 渲染：按年代分组 --></main>

  <p class="empty hidden" id="empty">
    <span class="t-zh">没有找到匹配的动画或角色，换个词试试？🐭</span>
    <span class="t-en">No match found, try another word? 🐭</span>
  </p>

  <!-- 详情弹层 -->
  <div class="modal hidden" id="modal" aria-hidden="true">
    <div class="modal-mask" id="modalMask"></div>
    <div class="modal-card" id="modalCard" role="dialog" aria-modal="true">
      <button class="modal-close" id="modalClose" aria-label="关闭">✕</button>
      <div class="modal-body" id="modalBody"><!-- JS --></div>
    </div>
  </div>

  <script src="disney-data.js"></script>
  <script src="disney.js"></script>
</body>
</html>
