    .hero-icon { font-size:86px; animation:floaty 3.2s ease-in-out infinite; filter:drop-shadow(0 8px 16px rgba(61,126,255,.5)); }

    .hero-sub { font-size:clamp(15px,4vw,21px); margin-bottom:8px; opacity:.92; max-width:760px; }
    .hero-count { margin-top:18px; font-size:17px; color:var(--car-cyan); background:rgba(49,208,224,.12); border:2px solid var(--car-cyan); border-radius:var(--radius-md); padding:10px 22px; }
    .scroll-hint { margin-top:32px; font-size:16px; color:var(--star-gold); animation:bounce 1.4s infinite; }

    .section { padding:58px 20px; max-width:1080px; margin:0 auto; }

    .section-desc { text-align:center; font-size:17px; opacity:.85; margin-bottom:28px; max-width:820px; margin-left:auto; margin-right:auto; }

    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:18px; }
    .card { background:rgba(232,241,255,.06); border:2px solid rgba(232,241,255,.12); border-radius:var(--radius-lg); padding:20px 18px; box-shadow:var(--shadow); transition:transform .2s,border-color .2s; }
    .card:hover { transform:translateY(-6px); border-color:var(--car-cyan); }
    .card .big { font-family:'Fredoka One',cursive; font-size:26px; color:var(--star-gold); }
    .card h3 { color:var(--tech-green); font-size:18px; margin:6px 0; }
    .card p { font-size:15px; }

    /* 汽车拆解 */
    .breakdown-wrap { display:flex; flex-direction:column; gap:20px; align-items:center; }
    .car-stage { position:relative; width:100%; max-width:660px; height:360px; flex:0 0 auto; }
    .car-shadow { position:absolute; left:50%; bottom:14%; transform:translateX(-50%); width:74%; height:10px; background:rgba(0,0,0,.35); border-radius:50%; filter:blur(6px); transition:opacity .5s; }
    .car-silhouette { position:absolute; left:50%; bottom:22%; transform:translateX(-50%); width:76%; height:30%;
      background:linear-gradient(180deg,#eaf1f8,#b9c5d2); border-radius:18px 34px 12px 12px; box-shadow:inset 0 0 0 2px rgba(255,255,255,.25),0 10px 24px rgba(0,0,0,.35); transition:opacity .5s; }
    .car-cabin { position:absolute; left:50%; bottom:48%; transform:translateX(-50%); width:44%; height:22%;
      background:linear-gradient(180deg,#f0f5fb,#c6d0db); border-radius:26px 30px 4px 4px; transition:opacity .5s; }
    .car-wheel { position:absolute; bottom:16%; width:64px; height:64px; border-radius:50%; background:radial-gradient(circle at 50% 50%,#4a5560 0 42%,#20262e 43% 100%); box-shadow:inset 0 0 0 4px #66727f; transition:opacity .5s; }
    .car-wheel.w1 { left:22%; } .car-wheel.w2 { left:64%; }
    .car-stage.exploded-mode .car-silhouette,
    .car-stage.exploded-mode .car-cabin,
    .car-stage.exploded-mode .car-wheel,
    .car-stage.exploded-mode .car-shadow { opacity:.12; }
    .part { position:absolute; font-size:30px; cursor:pointer; transition:left .6s cubic-bezier(.34,1.56,.64,1), top .6s cubic-bezier(.34,1.56,.64,1), filter .2s; filter:drop-shadow(0 4px 8px rgba(0,0,0,.45)); text-align:center; transform:translate(-50%,-50%); z-index:3; }
    .part:hover { filter:drop-shadow(0 0 14px var(--star-gold)); }
    .part.active { filter:drop-shadow(0 0 16px var(--star-gold)); }
    .part .part-label { display:block; font-size:11.5px; color:var(--star-white); margin-top:2px; white-space:nowrap; background:rgba(13,27,42,.55); padding:1px 6px; border-radius:8px; }
    .breakdown-side { width:100%; max-width:660px; }
    .part-info { margin-top:12px; background:rgba(6,214,160,.1); border:2px solid var(--tech-green); border-radius:var(--radius-md); padding:18px; font-size:16px; min-height:110px; }
    .part-info b { color:var(--tech-green); }
    .btn { font-family:'ZCOOL KuaiLe',sans-serif; border:none; border-radius:var(--radius-md); padding:12px 20px; font-size:17px; cursor:pointer; background:var(--rocket-red); color:#fff; box-shadow:var(--shadow); transition:transform .15s cubic-bezier(.34,1.56,.64,1),filter .2s; margin:4px 6px 4px 0; }
    .btn:hover { transform:scale(1.06) rotate(-1deg); filter:brightness(1.1); }
    .btn-ghost { background:transparent; border:2px solid var(--tech-green); color:var(--tech-green); }

    /* 分类 */
    .cgroup { margin-bottom:26px; }
    .cgroup h3 { color:var(--star-gold); font-size:20px; margin-bottom:12px; text-align:center; }
    .chips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
    .chip { background:rgba(232,241,255,.07); border:2px solid rgba(232,241,255,.16); border-radius:999px; padding:8px 16px; font-size:14.5px; transition:transform .18s,border-color .18s; }
    .chip:hover { transform:translateY(-4px); border-color:var(--car-cyan); }
    .chip b { color:var(--tech-green); }

    /* 对比表 */
    .cmp { width:100%; border-collapse:collapse; font-size:15px; }
    .cmp th, .cmp td { text-align:left; padding:11px 12px; border-bottom:1px solid rgba(232,241,255,.14); vertical-align:top; }
    .cmp th { color:var(--star-gold); font-family:'Fredoka One',cursive; font-weight:400; }
    .cmp td:first-child { color:var(--car-cyan); }

    .note { background:rgba(232,241,255,.06); border:2px dashed rgba(232,241,255,.25); border-radius:var(--radius-lg); padding:22px; margin-top:22px; font-size:15.5px; }
    .note h3 { color:var(--star-gold); font-size:19px; margin-bottom:10px; }
    .note ul { padding-left:22px; } .note li { margin-bottom:6px; }

    .footer { text-align:center; padding:66px 20px 90px; }
    .footer-title { font-family:'Fredoka One',cursive; font-size:30px; color:var(--tech-green); margin-bottom:14px; }
    .footer p { font-size:17px; max-width:680px; margin:0 auto 10px; }
    .footer-sign { color:var(--star-gold); margin-top:18px; }
    .hint { opacity:.8; }

    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(10px)} }
    @media (max-width:620px) { .nav-links a { margin-left:7px; font-size:12.5px; } .topbar { padding:10px 14px; } .car-stage { height:300px; } .part { font-size:26px; } }
  </style>

  (function starfield() {
    const canvas = document.getElementById('starfield'); const ctx = canvas.getContext('2d'); let stars = [];
    function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; initStars(); }
    function initStars(){ const c=Math.floor((canvas.width*canvas.height)/6500);
      stars = Array.from({length:c},()=>({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.5+0.4, a:Math.random(), speed:Math.random()*0.02+0.005, color:Math.random()>0.5?'#FFD166':'#BFE9FF' })); }

    window.addEventListener('resize',resize); resize(); draw();
  })();

      infoEn:`<b>Steering</b>: when you turn the wheel, gears and rods angle the front wheels so the car can turn.` },
    { id:"brakes", emoji:"🛑", labelZh:"制动系统", labelEn:"Brakes", x:65, y:74, ex:66, ey:96,
      infoZh:`<b>制动系统</b>：刹车盘与刹车片互相摩擦，把汽车的速度变成热量，让它稳稳停下来。`,
      infoEn:`<b>Brakes</b>: discs and pads rub together, turning speed into heat so the car stops safely.` },
    { id:"wheels", emoji:"🛞", labelZh:"车轮与轮胎", labelEn:"Wheels & tires", x:76, y:74, ex:92, ey:84,
      infoZh:`<b>车轮与轮胎</b>：汽车唯一接触地面的部件。轮胎的花纹负责抓地，也影响噪音和油耗。`,
      infoEn:`<b>Wheels & tires</b>: the only parts touching the ground. Tread grips the road and affects noise and fuel use.` },
    { id:"battery", emoji:"🔋", labelZh:"电气与电池", labelEn:"Electrics & battery", x:62, y:46, ex:96, ey:26,
      infoZh:`<b>电气系统</b>：蓄电池、发电机、车载电脑和灯光。电动车的大电池包还能直接驱动电机。`,
      infoEn:`<b>Electrical system</b>: battery, alternator, onboard computers and lights. In an EV, the big battery pack also powers the motor.` },
    { id:"exhaust", emoji:"💨", labelZh:"排气系统", labelEn:"Exhaust", x:88, y:64, ex:98, ey:60,
      infoZh:`<b>排气系统</b>：把发动机的废气排出去，并用消音器降低噪音。电动车没有它！`,
      infoEn:`<b>Exhaust</b>: carries waste gases away and muffles the noise. EVs don't have one!` }
  ];

  /* ===== 分类 ===== */
  const CLASSIFY = [
    { titleZh:"按用途分", titleEn:"By use", items:[
      { zh:"轿车", en:"Sedan" }, { zh:"SUV 运动型多用途车", en:"SUV" }, { zh:"MPV 多用途汽车", en:"MPV" },
      { zh:"跑车", en:"Sports car" }, { zh:"皮卡", en:"Pickup" }, { zh:"货车", en:"Truck" }, { zh:"客车/大巴", en:"Bus" }
    ]},
    { titleZh:"按动力分", titleEn:"By power", items:[
      { zh:"汽油车", en:"Petrol" }, { zh:"柴油车", en:"Diesel" }, { zh:"纯电动车 BEV", en:"Battery EV" },
      { zh:"油电混动 HEV", en:"Hybrid" }, { zh:"插电混动 PHEV", en:"Plug-in hybrid" }, { zh:"增程式 EREV", en:"Range-extender EV" }, { zh:"氢燃料电池 FCEV", en:"Hydrogen fuel cell" }
    ]},
    { titleZh:"按车身分", titleEn:"By body style", items:[
      { zh:"三厢轿车", en:"Three-box sedan" }, { zh:"两厢车", en:"Hatchback" }, { zh:"掀背车", en:"Liftback" },
      { zh:"旅行车", en:"Wagon / Estate" }, { zh:"敞篷车", en:"Convertible" }, { zh:"硬顶跑车", en:"Coupé" }
    ]},
    { titleZh:"按驱动分", titleEn:"By drive", items:[
      { zh:"前驱 FWD", en:"Front-wheel drive" }, { zh:"后驱 RWD", en:"Rear-wheel drive" }, { zh:"四驱 AWD / 4WD", en:"All-wheel / 4-wheel drive" }
    ]},
    { titleZh:"按自动驾驶分（L0–L5）", titleEn:"By autonomy (L0–L5)", items:[
      { zh:"L0 完全人工", en:"L0 – fully manual" }, { zh:"L1 辅助驾驶", en:"L1 – driver assist" }, { zh:"L2 部分自动", en:"L2 – partial" },
      { zh:"L3 有条件自动", en:"L3 – conditional" }, { zh:"L4 高度自动", en:"L4 – high" }, { zh:"L5 完全自动", en:"L5 – full" }
    ]}
  ];

  /* ===== 对比 ===== */
  const COMPARE = [
    { itemZh:"动力来源", itemEn:"Power source", fuelZh:"汽油 / 柴油发动机", fuelEn:"Petrol or diesel engine", evZh:"电池 + 电动机", evEn:"Battery + electric motor" },
    { itemZh:"能量补给", itemEn:"Refuelling", fuelZh:"去加油站加油（几分钟）", fuelEn:"Fill up at a station (a few minutes)", evZh:"充电桩充电（半小时以上）", evEn:"Charge at a plug (half an hour or more)" },
    { itemZh:"核心部件", itemEn:"Key parts", fuelZh:"发动机 + 变速箱 + 排气", fuelEn:"Engine + transmission + exhaust", evZh:"电池包 + 电机（结构更简单）", evEn:"Battery pack + motor (simpler)" },
    { itemZh:"起步加速", itemEn:"Off the line", fuelZh:"需要转速上来才有劲", fuelEn:"Needs revs to build power", evZh:"电机一踩就来，起步更快", evEn:"Instant torque — quicker off the line" },
    { itemZh:"尾气排放", itemEn:"Emissions", fuelZh:"有尾气排放", fuelEn:"Emits exhaust gases", evZh:"行驶时零尾气", evEn:"Zero tailpipe emissions" },
    { itemZh:"续航与补能", itemEn:"Range & refuelling", fuelZh:"加满油跑得远，加油快", fuelEn:"Long range, fast to refuel", evZh:"续航受电池限制，充电较慢", evEn:"Range limited by battery, slower to recharge" }
  ];

  /* ===== 渲染 ===== */
  let lang = localStorage.getItem('car-lang') || 'zh';
  const T = () => I18N[lang];
  const zh = (a,b) => lang === 'zh' ? a : b;

  function applyUI() {
    const t = T();
    document.getElementById('ui-brand').textContent = t.brand;
    document.getElementById('ui-nav-hero').textContent = t.navHero;
    document.getElementById('ui-nav-overview').textContent = t.navOverview;
    document.getElementById('ui-nav-structure').textContent = t.navStructure;
    document.getElementById('ui-nav-classify').textContent = t.navClassify;
    document.getElementById('ui-nav-compare').textContent = t.navCompare;
    document.getElementById('ui-hero-pre').textContent = t.heroPre;
    document.getElementById('ui-hero-hl').textContent = t.heroHl;
    document.getElementById('ui-hero-sub').textContent = t.heroSub;
    document.getElementById('heroCount').textContent = t.heroCount;
    document.getElementById('ui-scroll').textContent = t.scroll;
    document.getElementById('ui-ov-title').textContent = t.ovTitle;
    document.getElementById('ui-ov-desc').textContent = t.ovDesc;
    document.getElementById('ui-st-title').textContent = t.stTitle;
    document.getElementById('ui-st-desc').textContent = t.stDesc;
    document.getElementById('ui-st-hint').textContent = t.stHint;
    document.getElementById('explodeBtn').textContent = t.explode;
    document.getElementById('assembleBtn').textContent = t.assemble;
    document.getElementById('ui-cl-title').textContent = t.clTitle;
    document.getElementById('ui-cl-desc').textContent = t.clDesc;
    document.getElementById('ui-cmp-title').textContent = t.cmpTitle;
    document.getElementById('ui-cmp-desc').textContent = t.cmpDesc;
    document.getElementById('ui-ft-title').textContent = t.ftTitle;
    document.getElementById('ui-ft-p1').textContent = t.ftP1;
    document.getElementById('ui-ft-p2').textContent = t.ftP2;
    document.getElementById('ui-ft-sign').textContent = t.ftSign;
    document.getElementById('langBtn').textContent = t.langOther;
    document.getElementById('evNote').innerHTML = `<h3>${t.evH3}</h3><ul><li>${t.evLi1}</li><li>${t.evLi2}</li><li>${t.evLi3}</li></ul>`;
    document.getElementById('cmpHead').innerHTML = `<tr><th>${t.cmpItem}</th><th>${t.cmpFuel}</th><th>${t.cmpEv}</th></tr>`;
  }

  function renderOverview() {
    document.getElementById('overview').innerHTML = OVERVIEW.map(o => `
      <div class="card"><div class="big">${o.big}</div><h3>${zh(o.labelZh,o.labelEn)}</h3><p>${zh(o.descZh,o.descEn)}</p></div>`).join('');
  }

  function renderClassify() {
    document.getElementById('classify').innerHTML = CLASSIFY.map(g => `
      <div class="cgroup">
        <h3>${zh(g.titleZh,g.titleEn)}</h3>
        <div class="chips">${g.items.map(i => `<span class="chip">${zh(i.zh,i.en)}</span>`).join('')}</div>
      </div>`).join('');
  }

  function renderCompare() {
    document.getElementById('cmpBody').innerHTML = COMPARE.map(r => `
      <tr><td>${zh(r.itemZh,r.itemEn)}</td><td>${zh(r.fuelZh,r.fuelEn)}</td><td>${zh(r.evZh,r.evEn)}</td></tr>`).join('');
  }

  function renderParts() {
    const stage = document.getElementById('carStage');
    const info = document.getElementById('partInfo');
    PARTS.forEach(p => {
      const el = document.createElement('div');
      el.className = 'part assembled'; el.dataset.id = p.id;
      el.style.left = p.x + '%'; el.style.top = p.y + '%';
      el.innerHTML = `${p.emoji}<span class="part-label">${zh(p.labelZh,p.labelEn)}</span>`;
      el.addEventListener('click', () => {
        document.querySelectorAll('.part').forEach(x => x.classList.remove('active'));
        el.classList.add('active');
        info.innerHTML = zh(p.infoZh, p.infoEn);
      });
      stage.appendChild(el);
    });
  }

  function setMode(exploded) {
    const stage = document.getElementById('carStage');
    stage.classList.toggle('exploded-mode', exploded);
    document.querySelectorAll('.part').forEach((el, i) => {
      const p = PARTS[i];
      el.classList.toggle('exploded', exploded);
      el.classList.toggle('assembled', !exploded);
      el.style.left = (exploded ? p.ex : p.x) + '%';
      el.style.top = (exploded ? p.ey : p.y) + '%';
      el.querySelector('.part-label').textContent = zh(p.labelZh, p.labelEn);
    });
  }

  function updateLang() {
    applyUI(); renderOverview(); renderClassify(); renderCompare(); renderParts();
    const info = document.getElementById('partInfo');
    if (!info.querySelector('b')) info.innerHTML = `<span class="hint">${T().stHint}</span>`;
  }

  document.getElementById('explodeBtn').addEventListener('click', () => setMode(true));
  document.getElementById('assembleBtn').addEventListener('click', () => setMode(false));
  document.getElementById('langBtn').addEventListener('click', () => {
    lang = (lang === 'zh') ? 'en' : 'zh';
    localStorage.setItem('car-lang', lang);
    updateLang();
  });

  updateLang();
  </script>
</body>
</html>
