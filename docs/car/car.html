<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&family=Fredoka+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet" />
  <style>
    :root {
      --space-deep:#0D1B2A; --space-purple:#1B0033; --star-gold:#FFD166;
      --rocket-red:#EF476F; --star-white:#E8F1FF; --tech-green:#06D6A0;
      --car-blue:#3D7EFF; --car-cyan:#31D0E0; --radius-lg:28px; --radius-md:18px;
      --shadow:0 12px 30px rgba(0,0,0,.35);
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html { scroll-behavior:smooth; }
    body { font-family:'ZCOOL KuaiLe','Nunito',sans-serif; background:linear-gradient(160deg,#0A1A33 0%,var(--space-purple) 48%,var(--space-deep) 100%); background-attachment:fixed; color:var(--star-white); overflow-x:hidden; line-height:1.75; }
    #starfield { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
    .topbar,header,section,footer { position:relative; z-index:1; }

    .topbar { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; justify-content:space-between; padding:14px 22px; background:rgba(13,27,42,.62); backdrop-filter:blur(8px); z-index:50; }
    .logo { font-family:'Fredoka One',cursive; font-size:22px; color:var(--star-gold); }
    .nav-right { display:flex; align-items:center; gap:14px; }
    .nav-links a { color:var(--star-white); text-decoration:none; margin-left:13px; font-size:14.5px; opacity:.85; transition:color .2s,transform .2s; }
    .nav-links a:hover { color:var(--star-gold); transform:translateY(-2px); }
    .lang-btn { font-family:'ZCOOL KuaiLe',sans-serif; border:2px solid var(--star-gold); background:transparent; color:var(--star-gold); border-radius:999px; padding:6px 16px; font-size:15px; cursor:pointer; transition:transform .15s,background .2s; }
    .lang-btn:hover { transform:scale(1.06); background:rgba(255,209,102,.15); }

    .hero { min-height:70vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:96px 20px 34px; }
    .hero-icon { font-size:82px; animation:floaty 3.2s ease-in-out infinite; filter:drop-shadow(0 8px 16px rgba(61,126,255,.5)); }
    .hero-title { font-family:'Fredoka One',cursive; font-size:clamp(32px,7.5vw,62px); margin:10px 0; text-shadow:0 4px 0 rgba(61,126,255,.55); }
    .hero-title .hl { color:var(--star-gold); }
    .hero-sub { font-size:clamp(15px,4vw,21px); margin-bottom:8px; opacity:.92; max-width:780px; }
    .hero-count { margin-top:18px; font-size:17px; color:var(--car-cyan); background:rgba(49,208,224,.12); border:2px solid var(--car-cyan); border-radius:var(--radius-md); padding:10px 22px; }
    .scroll-hint { margin-top:30px; font-size:16px; color:var(--star-gold); animation:bounce 1.4s infinite; }

    .section { padding:56px 20px; max-width:1080px; margin:0 auto; }
    .section-title { font-family:'Fredoka One',cursive; font-size:clamp(23px,5.6vw,38px); text-align:center; color:var(--star-gold); margin-bottom:12px; }
    .section-desc { text-align:center; font-size:17px; opacity:.85; margin-bottom:26px; max-width:820px; margin-left:auto; margin-right:auto; }

    /* ===== 拆解 ===== */
    .explorer { background:rgba(232,241,255,.05); border:2px solid rgba(232,241,255,.12); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow); }
    .car-wrap { display:flex; flex-direction:column; align-items:center; gap:10px; }
    .car-svg { width:100%; max-width:720px; height:auto; display:block; }
    .car-svg .car-body { fill:url(#bodyGrad); stroke:rgba(255,255,255,.35); stroke-width:2; }
    .car-svg .car-glass { fill:#0E2233; opacity:.85; }
    .car-svg .tire { fill:#1b2027; stroke:#5d6a78; stroke-width:3; }
    .car-svg .rim { fill:url(#rimGrad); }
    .car-svg .hub { fill:#3a4553; }
    .car-svg .spoke { stroke:#9fb0c0; stroke-width:3; stroke-linecap:round; }
    .car-svg .line { stroke:rgba(255,255,255,.35); stroke-width:2; fill:none; }
    .car-svg .hl { fill:#FFE9A8; }
    .car-svg .tl { fill:#FF5A5A; }
    .car-svg .port { fill:none; stroke:#31D0E0; stroke-width:3; }
    .car-svg .zone { opacity:0; transition:opacity .35s; pointer-events:none; }
    .car-svg .zone rect, .car-svg .zone path { fill:rgba(255,209,102,.30); stroke:var(--star-gold); stroke-width:2; stroke-dasharray:6 5; }
    .car-svg .zone.on { opacity:1; }
    .syschips { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:6px; }
    .syschip { background:rgba(232,241,255,.07); border:2px solid rgba(232,241,255,.18); border-radius:999px; padding:9px 16px; font-size:15px; cursor:pointer; transition:transform .18s,border-color .18s,background .18s; }
    .syschip:hover { transform:translateY(-4px); border-color:var(--car-cyan); }
    .syschip.active { border-color:var(--star-gold); background:rgba(212,175,55,.18); }

    .crumbs { display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin:20px 0 14px; font-size:15px; }
    .crumb { cursor:pointer; padding:4px 12px; border-radius:999px; background:rgba(232,241,255,.08); border:1px solid rgba(232,241,255,.16); transition:border-color .18s,color .18s; }
    .crumb:hover { border-color:var(--car-cyan); color:var(--car-cyan); }
    .crumb.cur { background:rgba(212,175,55,.18); border-color:var(--star-gold); color:var(--star-gold); cursor:default; }
    .crumb-sep { opacity:.5; }

    .cur-node { display:flex; align-items:flex-start; gap:12px; background:rgba(6,214,160,.08); border:2px solid var(--tech-green); border-radius:var(--radius-md); padding:16px 18px; margin-bottom:18px; }
    .cur-node .cn-icon { font-size:38px; line-height:1; }
    .cur-node h3 { color:var(--tech-green); font-size:20px; }
    .cur-node p { font-size:15.5px; margin-top:4px; }

    .children { display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:14px; }
    .child { background:rgba(232,241,255,.06); border:2px solid rgba(232,241,255,.13); border-radius:var(--radius-md); padding:15px 14px; cursor:pointer; transition:transform .18s,border-color .18s,background .18s; }
    .child:hover { transform:translateY(-5px); border-color:var(--car-cyan); background:rgba(49,208,224,.08); }
    .child.leaf:hover { border-color:var(--star-gold); background:rgba(255,209,102,.08); }
    .child .c-top { display:flex; align-items:center; gap:10px; }
    .child .c-icon { font-size:26px; }
    .child .c-name { font-size:16.5px; color:var(--tech-green); }
    .child .c-sub { font-size:13px; opacity:.75; }
    .child p { font-size:14px; margin-top:8px; opacity:.9; }
    .child .c-count { display:inline-block; margin-top:8px; font-size:12px; padding:1px 9px; border-radius:999px; background:rgba(255,209,102,.16); border:1px solid var(--star-gold); color:var(--star-gold); }
    .child.leaf .c-count { display:none; }
    .empty-hint { text-align:center; font-size:15px; opacity:.75; padding:14px; }

    /* 速查 */
    .quick { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
    .qcard { background:rgba(232,241,255,.06); border:2px solid rgba(232,241,255,.12); border-radius:var(--radius-md); padding:18px; }
    .qcard h3 { color:var(--star-gold); font-size:18px; margin-bottom:10px; text-align:center; }
    .chips { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; }
    .chip { background:rgba(232,241,255,.07); border:1px solid rgba(232,241,255,.18); border-radius:999px; padding:6px 13px; font-size:14px; }

    .footer { text-align:center; padding:64px 20px 90px; }
    .footer-title { font-family:'Fredoka One',cursive; font-size:30px; color:var(--tech-green); margin-bottom:14px; }
    .footer p { font-size:17px; max-width:680px; margin:0 auto 10px; }
    .footer-sign { color:var(--star-gold); margin-top:18px; }
    .hint { opacity:.8; }

    @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-18px)} }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(10px)} }
    @media (max-width:620px) { .nav-links a { margin-left:7px; font-size:12.5px; } .topbar { padding:10px 14px; } .explorer { padding:14px; } }
  </style>
</head>

  <script>
  /* ===== 星空背景 ===== */
  (function starfield() {
    const canvas = document.getElementById('starfield'); const ctx = canvas.getContext('2d'); let stars = [];
    function resize(){ canvas.width=window.innerWidth; canvas.height=window.innerHeight; initStars(); }
    function initStars(){ const c=Math.floor((canvas.width*canvas.height)/6500);
      stars = Array.from({length:c},()=>({ x:Math.random()*canvas.width, y:Math.random()*canvas.height, r:Math.random()*1.5+0.4, a:Math.random(), speed:Math.random()*0.02+0.005, color:Math.random()>0.5?'#FFD166':'#BFE9FF' })); }
    function draw(){ ctx.clearRect(0,0,canvas.width,canvas.height); stars.forEach(s=>{ s.a+=s.speed; const al=0.35+Math.abs(Math.sin(s.a))*0.6; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fillStyle=s.color; ctx.globalAlpha=al; ctx.fill(); }); ctx.globalAlpha=1; requestAnimationFrame(draw); }
    window.addEventListener('resize',resize); resize(); draw();
  })();

          { id:"ac", emoji:"❄️", zh:"空调系统", en:"Air conditioning", descZh:"让车内冬暖夏凉。", descEn:"Keeps the cabin cool in summer and warm in winter.",
            children:[
              { id:"compressor", emoji:"🌀", zh:"电动压缩机", en:"Electric compressor", descZh:"制冷的核心，电动车用电动版（靠电池驱动）。", descEn:"The heart of cooling — an electric one in EVs, run off the battery." },
              { id:"condenser", emoji:"♨️", zh:"冷凝器", en:"Condenser", descZh:"把热量散发到车外。", descEn:"Dumps heat outside the car." },
              { id:"evaporator", emoji:"❄️", zh:"蒸发器", en:"Evaporator", descZh:"吹出冷风的部件。", descEn:"The part that blows out cold air." },
              { id:"filter", emoji:"🌬️", zh:"空调滤芯", en:"Cabin air filter", descZh:"过滤灰尘和花粉，要定期更换。", descEn:"Filters dust and pollen; replace it regularly." },
              { id:"ventout", emoji:"💨", zh:"出风口", en:"Air vent", descZh:"吹风的口子，可以调方向。", descEn:"The adjustable vents blowing air." }
            ]},
          { id:"electric", emoji:"🔌", zh:"电气设备", en:"Electrics", descZh:"车里的“神经系统”。", descEn:"The car's “nervous system.”",
            children:[
              { id:"bat12", emoji:"🔋", zh:"12V 蓄电池", en:"12V battery", descZh:"给车灯、电脑、门锁供电的小电瓶。", descEn:"The small battery powering lights, computers and locks." },
              { id:"ecu", emoji:"🧠", zh:"车载电脑 ECU", en:"Onboard computer (ECU)", descZh:"汽车的“大脑”，处理各种指令。", descEn:"The car's “brain,” processing commands." },
              { id:"harness", emoji:"🧵", zh:"线束", en:"Wiring harness", descZh:"像神经一样连满全车的电线束。", descEn:"The cable bundles running through the car like nerves." },
              { id:"audio", emoji:"🔊", zh:"音响", en:"Speakers", descZh:"放音乐、听广播。", descEn:"For music and radio." },
              { id:"lightsw", emoji:"🔘", zh:"灯光开关", en:"Light switch", descZh:"控制车灯的开与关。", descEn:"Turns the lights on and off." },
              { id:"wctrl", emoji:"🌧️", zh:"雨刮控制", en:"Wiper control", descZh:"控制雨刮的快慢和间歇。", descEn:"Controls wiper speed and intervals." }
            ]}
        ]}
    ]
  };

  /* ===== 车型速查（精简） ===== */
  const QUICK = [
    { titleZh:"按动力（最常见）", titleEn:"By power (most common)", items:[
      { zh:"燃油车", en:"Petrol/Diesel" }, { zh:"油电混动 HEV", en:"Hybrid" }, { zh:"插电混动 PHEV", en:"Plug-in hybrid" }, { zh:"纯电动 BEV", en:"Battery EV" }, { zh:"增程式 EREV", en:"Range-extender EV" }
    ]},
    { titleZh:"按车身（最常见）", titleEn:"By body (most common)", items:[
      { zh:"轿车", en:"Sedan" }, { zh:"SUV", en:"SUV" }, { zh:"MPV", en:"MPV" }, { zh:"跑车", en:"Sports car" }, { zh:"皮卡", en:"Pickup" }
    ]}
  ];

  /* ===== 渲染 ===== */
  let lang = localStorage.getItem('car-lang') || 'zh';
  let path = [];   // 从 TREE 顶层往下走的 id 序列
  const T = () => I18N[lang];
  const zh = (a,b) => lang === 'zh' ? a : b;

  function nodeAt(p){ let n = TREE; for (const id of p){ n = (n.children||[]).find(c=>c.id===id) || n; } return n; }
  function isLeaf(n){ return !n.children || n.children.length === 0; }

  function applyUI() {
    const t = T();
    document.getElementById('ui-brand').textContent = t.brand;
    document.getElementById('ui-nav-hero').textContent = t.navHero;
    document.getElementById('ui-nav-bd').textContent = t.navBd;
    document.getElementById('ui-nav-types').textContent = t.navTypes;
    document.getElementById('ui-hero-pre').textContent = t.heroPre;
    document.getElementById('ui-hero-hl').textContent = t.heroHl;
    document.getElementById('ui-hero-sub').textContent = t.heroSub;
    document.getElementById('heroCount').textContent = t.heroCount;
    document.getElementById('ui-scroll').textContent = t.scroll;
    document.getElementById('ui-bd-title').textContent = t.bdTitle;
    document.getElementById('ui-bd-desc').textContent = t.bdDesc;
    document.getElementById('ui-ty-title').textContent = t.tyTitle;
    document.getElementById('ui-ty-desc').textContent = t.tyDesc;
    document.getElementById('ui-ft-title').textContent = t.ftTitle;
    document.getElementById('ui-ft-p1').textContent = t.ftP1;
    document.getElementById('ui-ft-p2').textContent = t.ftP2;
    document.getElementById('ui-ft-sign').textContent = t.ftSign;
    document.getElementById('langBtn').textContent = t.langOther;
  }

  function renderChips() {
    document.getElementById('syschips').innerHTML = TREE.children.map(s => `
      <div class="syschip${path[0]===s.id?' active':''}" data-sys="${s.id}">${s.emoji} ${zh(s.zh,s.en)}</div>`).join('');
    document.querySelectorAll('.syschip').forEach(c => c.addEventListener('click', () => { path = [c.dataset.sys]; renderAll(); }));
  }

  function highlightZone() {
    const sel = path[0] || null;
    document.querySelectorAll('#carSvg .zone').forEach(z => z.classList.toggle('on', z.dataset.zone === sel));
  }

  function renderCrumbs() {
    const t = T();
    let acc = [];
    const crumbs = [{ label: t.root, p: [] }];
    for (const id of path) { acc = [...acc, id]; const n = nodeAt(acc); crumbs.push({ label: zh(n.zh, n.en), p: [...acc] }); }
    document.getElementById('crumbs').innerHTML = crumbs.map((c, i) => {
      const last = i === crumbs.length - 1;
      return `<span class="crumb${last?' cur':''}" data-p='${JSON.stringify(c.p)}'>${c.label}</span>` + (last ? '' : '<span class="crumb-sep">›</span>');
    }).join('');
    document.querySelectorAll('.crumb').forEach(el => {
      if (el.classList.contains('cur')) return;
      el.addEventListener('click', () => { path = JSON.parse(el.dataset.p); renderAll(); });
    });
  }

  function renderCurrent() {
    const cur = nodeAt(path);
    document.getElementById('curNode').innerHTML = `
      <div class="cn-icon">${cur.emoji}</div>
      <div><h3>${zh(cur.zh,cur.en)}</h3><p>${zh(cur.descZh,cur.descEn)}</p></div>`;
  }

  function renderChildren() {
    const cur = nodeAt(path);
    const t = T();
    const box = document.getElementById('children');
    if (isLeaf(cur)) { box.innerHTML = `<div class="empty-hint">${zh('🎉 已经拆到最小的零件啦，点上面的面包屑回去继续看。','🎉 This is the smallest part — use the breadcrumb above to go back.')}</div>`; return; }
    box.innerHTML = cur.children.map(c => {
      const leaf = isLeaf(c);
      const cnt = leaf ? '' : `<span class="c-count">${c.children.length > 6 || (c.children[0] && c.children[0].children) ? t.cntAssemblies(c.children.length) : t.cntParts(c.children.length)}</span>`;
      return `<div class="child${leaf?' leaf':''}" data-id="${c.id}">
        <div class="c-top"><span class="c-icon">${c.emoji}</span><div><div class="c-name">${zh(c.zh,c.en)}</div></div></div>
        <p>${zh(c.descZh,c.descEn)}</p>${cnt}
      </div>`;
    }).join('');
    box.querySelectorAll('.child').forEach(el => el.addEventListener('click', () => { path = [...path, el.dataset.id]; renderAll(); }));
  }

  function renderQuick() {
    document.getElementById('quick').innerHTML = QUICK.map(g => `
      <div class="qcard"><h3>${zh(g.titleZh,g.titleEn)}</h3>
        <div class="chips">${g.items.map(i => `<span class="chip">${zh(i.zh,i.en)}</span>`).join('')}</div>
      </div>`).join('');
  }

  function renderAll() {
    applyUI(); renderChips(); highlightZone(); renderCrumbs(); renderCurrent(); renderChildren(); renderQuick();
  }

  document.getElementById('langBtn').addEventListener('click', () => {
    lang = (lang === 'zh') ? 'en' : 'zh';
    localStorage.setItem('car-lang', lang);
    renderAll();
  });

  renderAll();
  </script>
</body>
</html>
